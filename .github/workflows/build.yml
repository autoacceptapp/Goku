name: Build GokuAgent Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Build app-debug.apk
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download official Sherpa-ONNX Android AAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/libs
          AAR_URL=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/k2-fsa/sherpa-onnx/releases/latest | python3 -c '
          import json, re, sys
          data = json.load(sys.stdin)
          assets = data.get("assets", [])
          preferred = [
              a["browser_download_url"]
              for a in assets
              if re.match(r"^sherpa-onnx-[0-9]+\.[0-9]+\.[0-9]+\.aar$", a.get("name", ""))
          ]
          fallback = [
              a["browser_download_url"]
              for a in assets
              if a.get("name", "").startswith("sherpa-onnx-")
              and a.get("name", "").endswith(".aar")
              and "rknn" not in a.get("name", "").lower()
              and "qnn" not in a.get("name", "").lower()
          ]
          urls = preferred or fallback
          if not urls:
              sys.exit("No official Sherpa-ONNX Android .aar asset found in latest release")
          print(urls[0])
          ')
          echo "Downloading Sherpa-ONNX AAR from: ${AAR_URL}"
          curl -fSL --retry 3 --retry-delay 5 "${AAR_URL}" -o app/libs/sherpa-onnx.aar
          ls -lh app/libs/sherpa-onnx.aar
          unzip -tq app/libs/sherpa-onnx.aar

      - name: Prepare debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkey -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-configuration-cache --stacktrace

      - name: Verify APK output
        run: ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload app-debug.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: GokuAgent-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Debug APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: GokuAgent Latest Debug APK
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
          overwrite_files: true
